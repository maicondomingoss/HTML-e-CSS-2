<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">




</head>
<body>
    <main>
        <section id="Login">
            <div id="imagem">

            </div>
            <div id="formulario" >
                <h1>Login</h1> <br>
                <p>Seja bem-vindo(A) novamente. Faça login para acessar a sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                       
                        <input type="email" name="email" id="email" required placeholder="Digite seu e-mail" autocomplete="email" >
                         <label for="email" ></E-mail> E-mail
                         </label>
                    </div>


                    <br>
                 <div class="campo">
    
                     <input type="password" name="senha" id="isenha" required placeholder="Digite sua senha" minlength="8" autocomplete="current-password">
                     <label for="isenha">Senha</label>
                 </div>   
                 <br>
                 
                 <input type="submit" value="Entrar">
                 <input type="button" value="Esqueci minha senha">
                    
                </form>

            </div>
        </section>
    </main>
</body>
</html>
